<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; width: 320px; padding: 12px; background: #fafafa; }
  h1 { font-size: 14px; margin-bottom: 10px; color: #333; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
  button { padding: 6px 12px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
  .btn-primary { background: #cb11ab; color: #fff; }
  .btn-primary:hover { background: #b01095; }
  .btn-success { background: #2e7d32; color: #fff; }
  .btn-success:hover { background: #1b5e20; }
  .btn-danger { background: #e53935; color: #fff; }
  .btn-danger:hover { background: #c62828; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .status { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 8px; font-size: 11px; margin-top: 8px; line-height: 1.6; }
  .done { color: #2e7d32; }
  .pending { color: #f57f17; }
  .error { color: #c62828; }
  .divider { border-top: 1px solid #ddd; margin: 10px 0; }
  .progress { height: 6px; background: #eee; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .progress-bar { height: 100%; background: #cb11ab; width: 0%; transition: width 0.3s; }
  .progress-bar.search { background: #2e7d32; }
  .hint { font-size: 10px; color: #6b7280; line-height: 1.4; margin: 0 0 3px; }
</style>
</head>
<body>
  <h1>WB Competitor Parser</h1>

  <div class="row">
    <input id="serverInput" placeholder="http://хост:8000" title="Адрес бэка (подставлен при скачивании)">
  </div>
  <div class="row">
    <input id="tokenInput" type="password" placeholder="ext_... токен из карточки компании" title="Токен выдаётся в карточке компании, хранится только тут">
    <button id="saveSettingsBtn" class="btn btn-primary" title="Сохранить адрес и токен">ОК</button>
  </div>
  <div class="divider"></div>

  <div class="row">
    <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:#333;flex:1;cursor:pointer;">
      <input type="checkbox" id="autoCapture" checked style="flex:0 0 auto;">
      Собирать открытые карточки
    </label>
  </div>
  <div class="row">
    <button id="capBtn" class="btn btn-primary" style="flex:1;">Собрать текущую</button>
    <button id="recapBtn" class="btn" style="background:#eee;color:#333;" title="Игнорировать кэш 24 ч">↻ Пересобрать</button>
  </div>
  <div class="status" id="capStatus">—</div>
  <div class="divider"></div>

  <div class="row">
    <input id="nmId" type="number" placeholder="source nmID (пусто = все)">
    <button id="seedBtn" class="btn btn-primary">Очередь</button>
  </div>
  <div class="row">
    <select id="collectMode" style="flex:1; padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:11px;" title="Что собирать в режиме «Старт»">
      <option value="new">Новые (срочно)</option>
      <option value="refresh">Обновление старых</option>
      <option value="all">Всё подряд</option>
    </select>
  </div>
  <div class="row">
    <button id="startBtn" class="btn btn-primary" disabled>Старт</button>
    <button id="stopBtn" class="btn btn-danger" disabled>Стоп</button>
  </div>
  <div class="status" id="status">загрузка...</div>
  <div class="progress"><div class="progress-bar" id="progressEnrich"></div></div>
  <div class="row" style="margin-top:4px;">
    <button id="resetEnrichBtn" class="btn" style="background:#ff9800;color:#fff;font-size:10px;" title="Вернуть в pending ошибки и зависшие processing">Сброс ошибок/зависших</button>
  </div>

  <div class="divider"></div>

  <div class="row">
    <select id="categorySelect" style="flex:1; padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:11px;" title="Фильтр категорий из админки (xsubject выдачи WB)">
      <option value="">Без фильтра</option>
    </select>
  </div>
  <div class="hint">Источник поиска — в т.ч. «Запросы конкурентов»</div>
  <div class="row">
    <select id="searchSource" style="flex:1; padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:11px;" title="Для нового потока выберите «Запросы конкурентов»">
      <option value="seo">По фразам из карточки</option>
      <option value="report">ТОП-20 поисковых фраз</option>
      <option value="compquery">Запросы конкурентов</option>
      <option value="both">SEO + ТОП-20</option>
    </select>
  </div>
  <div class="row">
    <button id="searchStartBtn" class="btn btn-success" disabled>Поиск</button>
    <button id="searchStopBtn" class="btn btn-danger" disabled>Стоп</button>
  </div>
  <div class="hint">Поиск собирает только список. Описания — «Очередь» → «Старт» вверху.</div>
  <div class="status" id="searchStatus">загрузка...</div>
  <div class="progress"><div class="progress-bar search" id="progressSearch"></div></div>
  <div class="row" style="margin-top:4px;">
    <button id="resetSearchBtn" class="btn" style="background:#ff9800;color:#fff;font-size:10px;">Сброс ошибок поиска</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
